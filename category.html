<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Mục Tác Phẩm - Vũ Thiên Kiều</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #fdfbf7;
      --bg-card: #ffffff;
      --text-main: #2c3e50;
      --accent-green: #2d5a27;
      --accent-gold: #c5a059;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.5; }
    
    header { background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 1rem; text-align: center; }
    header a { font-family: 'Merriweather', serif; font-weight: 700; font-size: 1.2rem; color: var(--accent-green); text-decoration: none; }

    .container { max-width: 850px; margin: 2rem auto; padding: 0 1rem; }
    
    .category-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--accent-gold);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .back-link:hover { text-decoration: underline; }

    h1 {
      font-family: 'Merriweather', serif;
      color: var(--accent-green);
      font-size: 1.8rem;
      border-bottom: 2px solid var(--accent-gold);
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .post-item {
      padding: 1.2rem 0;
      border-bottom: 1px dashed var(--border-color);
    }
    .post-item:last-child { border-bottom: none; }

    .post-item h2 { font-family: 'Merriweather', serif; font-size: 1.25rem; margin-bottom: 0.3rem; }
    .post-item h2 a { color: var(--text-main); text-decoration: none; }
    .post-item h2 a:hover { color: var(--accent-green); }

    .post-item .meta { font-style: italic; color: #718096; font-size: 0.82rem; display: block; margin-bottom: 0.5rem; }
    .post-item .body-preview { font-size: 0.92rem; color: #4a5568; white-space: pre-wrap; line-height: 1.45; }
    .read-more { display: inline-block; margin-top: 0.5rem; color: var(--accent-green); font-weight: 600; text-decoration: none; font-size: 0.85rem; }
    
    footer { text-align: center; padding: 2rem; color: #888; font-size: 0.85rem; border-top: 1px solid var(--border-color); margin-top: 3rem; }
  </style>
</head>
<body>

  <header>
    <a href="/">VŨ THIÊN KIỀU</a>
  </header>

  <main class="container">
    <a href="/" class="back-link">← Trở về Trang chủ</a>
    
    <div class="category-card">
      <h1 id="category-title">Đang tải tác phẩm...</h1>
      <div id="category-posts-container"></div>
    </div>
  </main>

  <footer>
    <p>© Trang web văn học cá nhân Nhà Thơ Vũ Thiên Kiều</p>
  </footer>

  <script>
    const categoriesMap = {
      "tho-vu-thien-kieu": "Thơ Vũ Thiên Kiều",
      "chum-tho": "Chùm Thơ",
      "tan-van-va-ky": "Tản Văn & Ký",
      "truyen-ngan": "Truyện Ngắn",
      "goc-ban-van": "Góc Bạn Văn",
      "bao-chi": "Báo Chí & Truyền Thông",
      "ly-luan-binh": "Lý Luận & Bình Tác Phẩm"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const tagSlug = urlParams.get('tag');
    const targetCategoryName = categoriesMap[tagSlug] || "Danh Mục Tác Phẩm";

    document.getElementById('category-title').textContent = targetCategoryName;

    function getSnippet(body, category) {
      if (!body) return '';
      const isPoetry = category.includes("Thơ");
      if (isPoetry) {
        const lines = body.trim().split('\n');
        return lines.slice(0, 6).join('\n') + (lines.length > 6 ? '\n...' : '');
      } else {
        const cleanText = body.trim();
        return cleanText.length > 200 ? cleanText.substring(0, 200) + '...' : cleanText;
      }
    }

    function parseDate(dateStr) {
      if (!dateStr) return 0;
      const cleanDate = dateStr.replace(/"/g, '').trim();
      if (!cleanDate) return 0;

      const parts = cleanDate.split(/[\/\-]/);
      if (parts.length === 3) {
        return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
      }
      return new Date(cleanDate).getTime() || 0;
    }

    async function loadCategoryPosts() {
      try {
        const response = await fetch('https://api.github.com/repos/ran0789/web-vuthienkieu1/contents/content/posts');
        if (!response.ok) return;
        const files = await response.json();

        const container = document.getElementById('category-posts-container');
        container.innerHTML = '';

        const matchedPosts = [];

        for (let file of files) {
          if (file.name.endsWith('.md')) {
            try {
              const res = await fetch(file.download_url);
              const text = await res.text();

              const titleMatch = text.match(/title:\s*"(.*?)"/) || text.match(/title:\s*(.*)/);
              const categoryMatch = text.match(/category:\s*"(.*?)"/) || text.match(/category:\s*(.*)/);
              const authorMatch = text.match(/author:\s*"(.*?)"/) || text.match(/author:\s*(.*)/);

              // 1. Tách riêng Ngày Đăng Bài (date)
              const pubDateMatch = text.match(/^date:\s*"(.*?)"/m) || text.match(/^date:\s*(.*)/m);
              
              // 2. Tách riêng Ngày Sáng Tác (created_date hoặc written_date)
              const createDateMatch = text.match(/^created_date:\s*"(.*?)"/m) || text.match(/^created_date:\s*(.*)/m) || 
                                      text.match(/^written_date:\s*"(.*?)"/m) || text.match(/^written_date:\s*(.*)/m);

              const bodyParts = text.split('---');
              const body = bodyParts.length > 2 ? bodyParts.slice(2).join('---').trim() : '';
              const category = categoryMatch ? categoryMatch[1].replace(/"/g, '').trim() : '';

              let pubDate = pubDateMatch ? (pubDateMatch[1] || pubDateMatch[2] || '').replace(/"/g, '').trim() : '';
              let createDate = createDateMatch ? (createDateMatch[1] || createDateMatch[2] || '').replace(/"/g, '').trim() : '';

              if (category === targetCategoryName) {
                matchedPosts.push({
                  postId: file.name.replace('.md', ''),
                  title: titleMatch ? titleMatch[1].replace(/"/g, '').trim() : 'Không tiêu đề',
                  author: authorMatch ? authorMatch[1].replace(/"/g, '').trim() : 'Vũ Thiên Kiều',
                  pubDate: pubDate,
                  createDate: createDate,
                  timestamp: parseDate(pubDate), // Dùng Ngày Đăng để sắp xếp
                  body: body
                });
              }
            } catch (e) {}
          }
        }

        if (matchedPosts.length === 0) {
          container.innerHTML = '<p style="font-style: italic; color: #718096; text-align: center;">Chưa có bài viết nào trong danh mục này.</p>';
          return;
        }

        // SẮP XẾP BÀI ĐĂNG MỚI NHẤT LÊN ĐẦU (Dựa theo Timestamp Ngày Đăng)
        matchedPosts.sort((a, b) => b.timestamp - a.timestamp);

        matchedPosts.forEach(post => {
          const item = document.createElement('article');
          item.className = 'post-item';
          
          // Xử lý nhãn thông tin
          let metaText = `Tác giả: ${post.author}`;
          if (post.pubDate) metaText += ` | Ngày đăng: ${post.pubDate}`;
          if (post.createDate) metaText += ` | Sáng tác: ${post.createDate}`;

          item.innerHTML = `
            <h2><a href="/posts/${post.postId}.html">${post.title}</a></h2>
            <span class="meta">${metaText}</span>
            <div class="body-preview">${getSnippet(post.body, targetCategoryName)}</div>
            <a href="/posts/${post.postId}.html" class="read-more">Đọc toàn bộ tác phẩm ➔</a>
          `;
          container.appendChild(item);
        });

      } catch (err) {
        console.error("Lỗi tải bài viết danh mục:", err);
      }
    }

    loadCategoryPosts();
  </script>
</body>
</html>
