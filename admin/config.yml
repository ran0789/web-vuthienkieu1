backend:
  name: github
  repo: ran0789/web-vuthienkieu1
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. QUẢN LÝ BÀI VIẾT & TÁC PHẨM
  - name: "posts"
    label: "Bài Viết & Tác Phẩm"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "TIÊU ĐỀ BÀI VIẾT / BÀI BÁO", name: "title", widget: "string" }
      - { 
          label: "TRẠNG THÁI BÀI VIẾT", 
          name: "status", 
          widget: "select", 
          default: "published",
          options: [
            { label: "🟢 Xuất bản (Hiển thị trên trang chủ)", value: "published" },
            { label: "🟡 Bản nháp (Đang soạn thảo)", value: "draft" },
            { label: "🔴 Tạm ẩn (Ẩn khỏi trang chủ)", value: "hidden" }
          ]
        }
      - { 
          label: "THỂ LOẠI", 
          name: "category", 
          widget: "select", 
          options: [
            "Thơ Vũ Thiên Kiều", 
            "Chùm Thơ", 
            "Tản Văn & Ký", 
            "Truyện Ngắn", 
            "Góc Bạn Văn", 
            "Báo Chí & Truyền Thông", 
            "Lý Luận & Bình Tác Phẩm"
          ] 
        }
      - { label: "TÁC GIẢ / NGUỒN BÁO", name: "author", widget: "string", default: "Vũ Thiên Kiều" }
      - { label: "ẢNH MINH HỌA", name: "featured_image", widget: "image", required: false }
      - { 
          label: "KÍCH THƯỚC HIỂN THỊ ẢNH MINH HỌA", 
          name: "image_size", 
          widget: "select", 
          default: "medium",
          options: [
            { label: "Siêu nhỏ (Căn giữa - Max 200px)", value: "tiny" },
            { label: "Nhỏ (Căn giữa - Max 350px)", value: "small" },
            { label: "Vừa (Căn giữa - Max 500px)", value: "medium" },
            { label: "50% Chiều rộng khung bài", value: "half" },
            { label: "Tràn khung (100% Chiều rộng)", value: "full" }
          ],
          required: false 
        }
      - { label: "ĐƯỜNG LINK BÀI BÁO GỐC", name: "source_url", widget: "string", required: false }

      # --- ĐÃ SỬA CHUẨN SVELTIA CMS: Chọn ngày từ lịch (chỉ hiển thị ngày/tháng/năm) ---
      - { label: "NGÀY SÁNG TÁC", name: "created_date", widget: "datetime", date_only: true, required: false }
      
      - { label: "NGÀY ĐĂNG BÀI", name: "date", widget: "datetime", required: false }
      - { label: "NỘI DUNG TRÍCH DẪN / VĂN THƠ", name: "body", widget: "markdown" }
