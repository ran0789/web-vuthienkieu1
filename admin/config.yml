backend:
  name: github
  repo: ran0789/web-vuthienkieu1
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. QUẢN LÝ BÀI VIẾT & TÁC PHẨM
  - name: "posts"
    label: "Bài Viết & Tác Phẩm"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "TIÊU ĐỀ BÀI VIẾT / BÀI BÁO", name: "title", widget: "string" }
      - { 
          label: "THỂ LOẠI", 
          name: "category", 
          widget: "select", 
          options: [
            "Thơ Vũ Thiên Kiều", 
            "Chùm Thơ", 
            "Tản Văn & Ký", 
            "Truyện Ngắn", 
            "Góc Bạn Văn", 
            "Báo Chí & Truyền Thông", 
            "Lý Luận & Bình Tác Phẩm"
          ] 
        }
      - { label: "TÁC GIẢ / NGUỒN BÁO", name: "author", widget: "string", default: "Vũ Thiên Kiều" }
      - { label: "ẢNH MINH HỌA", name: "featured_image", widget: "image", required: false }
      - { 
          label: "KÍCH THƯỚC HIỂN THỊ ẢNH MINH HỌA", 
          name: "image_size", 
          widget: "select", 
          default: "medium",
          options: [
            { label: "Siêu nhỏ (Căn giữa - Max 200px)", value: "tiny" },
            { label: "Nhỏ (Căn giữa - Max 350px)", value: "small" },
            { label: "Vừa (Căn giữa - Max 500px)", value: "medium" },
            { label: "50% Chiều rộng khung bài", value: "half" },
            { label: "Tràn khung (100% Chiều rộng)", value: "full" }
          ],
          required: false 
        }
      - { label: "ĐƯỜNG LINK BÀI BÁO GỐC", name: "source_url", widget: "string", required: false }
      - { label: "NGÀY / ĐỊA ĐIỂM SÁNG TÁC", name: "created_date", widget: "string", required: false }
      - { label: "NGÀY ĐĂNG BÀI", name: "date", widget: "datetime", required: false }
      - { label: "NỘI DUNG TRÍCH DẪN / VĂN THƠ", name: "body", widget: "markdown" }

  # 2. GIỚI THIỆU TÁC GIẢ
  - name: "author_info"
    label: "Giới Thiệu Tác Giả"
    files:
      - file: "content/about.md"
        label: "Thông Tin Tác Giả"
        name: "about"
        fields:
          - { label: "TÊN TÁC GIẢ", name: "title", widget: "string", default: "Vũ Thiên Kiều" }
          - { label: "ẢNH ĐẠI DIỆN TÁC GIẢ", name: "avatar", widget: "image", required: false }
          - { label: "DANH HIỆU / CHỨC DANH", name: "subtitle", widget: "string", required: false }
          - { label: "NĂM SINH / QUÊ QUÁN", name: "bio_info", widget: "string", required: false }
          - { label: "NỘI DUNG TIỂU SỬ & SỰ NGHIỆP", name: "body", widget: "markdown" }

  # 3. CÀI ĐẶT CỘT BÊN (SIDEBAR)
  - name: "settings"
    label: "Cài Đặt Cột Bên"
    files:
      - label: "Thông tin Sidebar"
        name: "sidebar"
        file: "content/settings/sidebar.json"
        fields:
          - { label: "Tên Tác Giả", name: "author_name", widget: "string", default: "Vũ Thiên Kiều" }
          - { label: "Mô Tả Ngắn Tác Giả", name: "author_desc", widget: "string", default: "Hội viên Hội Nhà văn Việt Nam." }
          - { label: "Tên Tập Thơ Mới", name: "book_title", widget: "string", default: "Tuyển Tập Thơ Vũ Thiên Kiều" }
          - { label: "Ảnh Bìa Sách", name: "book_image", widget: "image", required: false }
          - { label: "Link Đặt Mua Sách (Zalo/SĐT)", name: "book_link", widget: "string", default: "https://zalo.me/" }
          - { label: "Link Facebook Cá Nhân", name: "fb_link", widget: "string", default: "https://facebook.com/" }
          - { label: "Link Kênh YouTube", name: "yt_link", widget: "string", default: "https://youtube.com/" }
