backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Bài Viết & Tác Phẩm"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "TIÊU ĐỀ BÀI VIẾT / BÀI BÁO", name: "title", widget: "string" }
      - { 
          label: "THỂ LOẠI", 
          name: "category", 
          widget: "select", 
          options: [
            "Thơ Vũ Thiên Kiều", 
            "Chùm Thơ", 
            "Tản Văn & Ký", 
            "Truyện Ngắn", 
            "Góc Bạn Văn", 
            "Báo Chí & Truyền Thông", 
            "Lý Luận & Bình Tác Phẩm"
          ] 
        }
      - { label: "TÁC GIẢ / NGUỒN BÁO (ví dụ: VŨ THIÊN KIỀU / BÁO VĂN NGHỆ)", name: "author", widget: "string", default: "Vũ Thiên Kiều" }
      - { label: "ẢNH MINH HỌA (TÙY CHỌN - KÍCH THƯỚC KHUYÊN DÙNG: 1200 X 675PX, TỶ LỆ 16:9, DUNG LƯỢNG < 500KB, ĐỊNH DẠNG JPG/.WEBP) (OPTIONAL)", name: "featured_image", widget: "image", required: false }
      - { 
          label: "KÍCH THƯỚC HIỂN THỊ ẢNH MINH HỌA", 
          name: "image_size", 
          widget: "select", 
          default: "medium",
          options: [
            { label: "Siêu nhỏ (Căn giữa - Max 200px)", value: "tiny" },
            { label: "Nhỏ (Căn giữa - Max 350px)", value: "small" },
            { label: "Vừa (Căn giữa - Max 500px)", value: "medium" },
            { label: "50% Chiều rộng khung bài", value: "half" },
            { label: "Tràn khung (100% Chiều rộng)", value: "full" }
          ],
          required: false 
        }
      - { label: "ĐƯỜNG LINK BÀI BÁO GỐC (CHỈ DÙNG KHI ĐĂNG BÀI THUỘC THỂ LOẠI BÁO CHÍ & TRUYỀN THÔNG) (OPTIONAL)", name: "source_url", widget: "string", required: false }
      - { label: "NGÀY / ĐỊA ĐIỂM SÁNG TÁC (TÙY CHỌN - VÍ DỤ: SƠN KIÊN, 2024) (OPTIONAL)", name: "created_date", widget: "string", required: false }
      - { label: "NGÀY ĐĂNG BÀI", name: "date", widget: "datetime", required: false }
      - { label: "NỘI DUNG TRÍCH DẪN / VĂN THƠ", name: "body", widget: "markdown" }
