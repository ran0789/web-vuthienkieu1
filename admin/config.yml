backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Bài Viết & Tác Phẩm"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Tiêu đề bài viết / Chùm thơ", name: "title", widget: "string" }
      - { 
          label: "Thể loại", 
          name: "category", 
          widget: "select", 
          options: [
            "Thơ Vũ Thiên Kiều", 
            "Chùm Thơ",
            "Tản Văn & Ký", 
            "Truyện Ngắn",
            "Góc Bạn Văn", 
            "Lý Luận & Bình Tác Phẩm"
          ] 
        }
      - { label: "Tác giả", name: "author", widget: "string", default: "Vũ Thiên Kiều" }
      - { 
          label: "Ngày / Thời gian sáng tác (Có thể bỏ trống nếu không hiển thị, ví dụ: Sơn Kiên, 2024 hoặc 12/04/2025)", 
          name: "created_date", 
          widget: "string", 
          required: false 
        }
      - { label: "Ngày đăng bài", name: "date", widget: "datetime" }
      - { label: "Nội dung văn thơ / Các bài thơ trong chùm", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Trang Giới Thiệu"
    files:
      - file: "content/about.md"
        label: "Giới Thiệu Nhà Thơ Vũ Thiên Kiều"
        name: "about"
        fields:
          - { label: "Tiêu đề trang", name: "title", widget: "string", default: "Giới Thiệu Nhà Thơ Vũ Thiên Kiều" }
          - { label: "Lời giới thiệu / Tiểu sử / Lời ngỏ", name: "body", widget: "markdown" }
