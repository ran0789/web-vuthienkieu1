backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Bài viết"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tiêu đề bài viết", name: "title", widget: "string" }
      - { label: "Tác giả", name: "author", widget: "string", default: "Vũ Thiên Kiều" }
      - { 
          label: "Chuyên mục", 
          name: "category", 
          widget: "select", 
          options: [
            "Thơ Vũ Thiên Kiều", 
            "Chùm Thơ", 
            "Tản Văn & Ký", 
            "Truyện Ngắn", 
            "Góc Bạn Văn", 
            "Báo Chí & Truyền Thông", 
            "Lý Luận & Bình Tác Phẩm"
          ] 
        }
      - { label: "Ngày sáng tác / Đăng", name: "created_date", widget: "string", required: false }
      - { label: "Ảnh đại diện / Minh họa chính", name: "featured_image", widget: "image", required: false }
      - { 
          label: "Tùy chỉnh kích thước ảnh minh họa", 
          name: "image_size", 
          widget: "select", 
          default: "medium",
          options: [
            { label: "Siêu nhỏ (Căn giữa - Max 200px)", value: "tiny" },
            { label: "Nhỏ (Căn giữa - Max 350px)", value: "small" },
            { label: "Vừa (Căn giữa - Max 500px)", value: "medium" },
            { label: "50% Chiều rộng khung bài", value: "half" },
            { label: "75% Chiều rộng khung bài", value: "three_quarter" },
            { label: "Tràn khung (100% Chiều rộng)", value: "full" }
          ],
          required: false 
        }
      - { label: "Link bài báo gốc (nếu có)", name: "source_url", widget: "string", required: false }
      - { label: "Nội dung bài viết", name: "body", widget: "markdown" }
